name: Bootstrap Nexa Cloud Fixed Signing V2

on:
  push:
    branches:
      - cloud-v1.0.36-signing-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify cloud source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.nexa.app.cloud"' android/app/build.gradle.kts
          grep -F 'versionCode = 42' android/app/build.gradle.kts
          grep -F 'versionName = "1.0.36"' android/app/build.gradle.kts
          grep -F 'LauncherStar' android/app/src/main/AndroidManifest.xml

      - name: Build release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Generate fixed key, v2/v3 sign, and seal credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexa-key /tmp/deliver
          PASS="$(openssl rand -hex 24)"
          ALIAS="nexa-cloud"

          keytool -genkeypair             -keystore /tmp/nexa-key/nexa-cloud-release.jks             -storetype JKS             -storepass "$PASS"             -keypass "$PASS"             -alias "$ALIAS"             -keyalg RSA -keysize 4096 -validity 10000             -dname "CN=Nexa Cloud Release, OU=Nexa, O=Nexa, L=Singapore, ST=Singapore, C=SG"             >/dev/null 2>&1

          RELEASE="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"

          "$APKSIGNER" sign             --ks /tmp/nexa-key/nexa-cloud-release.jks             --ks-pass "pass:$PASS"             --ks-key-alias "$ALIAS"             --key-pass "pass:$PASS"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out /tmp/deliver/Nexa-Cloud-1.0.36-FixedSigned.apk             "$RELEASE"

          "$APKSIGNER" verify --verbose --print-certs             /tmp/deliver/Nexa-Cloud-1.0.36-FixedSigned.apk             > /tmp/deliver/APK_SIGNATURE_VERIFY.txt

          cp /tmp/nexa-key/nexa-cloud-release.jks /tmp/deliver/nexa-cloud-release.jks
          printf 'STORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n'             "$PASS" "$ALIAS" "$PASS" > /tmp/nexa-key/CREDENTIALS.txt

          echo ''             | base64 -d > /tmp/bootstrap-public.pem

          openssl pkeyutl -encrypt -pubin             -inkey /tmp/bootstrap-public.pem             -in /tmp/nexa-key/CREDENTIALS.txt             -out /tmp/deliver/CREDENTIALS.txt.enc             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256

          sha256sum /tmp/deliver/Nexa-Cloud-1.0.36-FixedSigned.apk             /tmp/deliver/nexa-cloud-release.jks             > /tmp/deliver/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Nexa-1.0.36-Fixed-Signing-Bootstrap-V2
          path: /tmp/deliver/*
          if-no-files-found: error
