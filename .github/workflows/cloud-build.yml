name: Nexa Cloud Build

on:
  push:
    branches:
      - cloud-v1.0.36-main
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply 1.0.36 source delta on seed branch
        if: github.ref_name == 'cloud-v1.0.36-main'
        shell: bash
        run: |
          set -euo pipefail
          cat .release36/patch-*.b64 > /tmp/nexa36.patch.gz.b64
          base64 -d /tmp/nexa36.patch.gz.b64 > /tmp/nexa36.patch.gz
          gzip -dc /tmp/nexa36.patch.gz > /tmp/nexa36.patch
          patch -p1 --batch < /tmp/nexa36.patch
          rm -rf .release36
          test -z "$(find . -name '*.rej' -print -quit)"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.nexa.app.cloud"' android/app/build.gradle.kts
          grep -F 'versionCode = 42' android/app/build.gradle.kts
          grep -F 'versionName = "1.0.36"' android/app/build.gradle.kts
          grep -F 'LauncherStar' android/app/src/main/AndroidManifest.xml
          grep -F 'getLauncherIcon' android/app/src/main/java/com/nexa/app/MainActivity.kt
          grep -F 'data-nx-app-icon' ui/nexa-workspace.js
          cmp ui/nexa-workspace.js android/app/src/main/assets/nexa-workspace.js
          cmp ui/nexa.css android/app/src/main/assets/nexa.css
          node --check ui/nexa-workspace.js
          node --test tests/*.test.cjs tests/*.test.js

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon

      - name: Sign release when fixed signing Secrets are configured
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NEXA_CLOUD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NEXA_CLOUD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXA_CLOUD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXA_CLOUD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p deliver
          cp android/app/build/outputs/apk/debug/*.apk deliver/Nexa-Cloud-1.0.36-Debug.apk
          RELEASE="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/nexa-cloud.jks
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
            "$APKSIGNER" sign --ks /tmp/nexa-cloud.jks --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out deliver/Nexa-Cloud-1.0.36-Signed.apk "$RELEASE"
            "$APKSIGNER" verify --verbose --print-certs deliver/Nexa-Cloud-1.0.36-Signed.apk
          else
            cp "$RELEASE" deliver/Nexa-Cloud-1.0.36-Unsigned.apk
            echo "Fixed signing Secrets are not configured; uploaded unsigned release + debug APK."
          fi

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          zip -qr deliver/Nexa-V1.0.36-Cloud-Source.zip . -x '.git/*' 'android/.gradle/*' 'android/app/build/*' 'deliver/*'
          sha256sum deliver/*

      - name: Promote verified 1.0.36 source to main
        if: github.ref_name == 'cloud-v1.0.36-main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nexa Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release Nexa 1.0.36 cloud coexistence line"
          git push origin HEAD:main --force-with-lease

      - uses: actions/upload-artifact@v4
        with:
          name: Nexa-1.0.36-Cloud-Deliverables
          path: deliver/*
          if-no-files-found: error
