name: Bootstrap Nexa Cloud Fixed Signing

on:
  push:
    branches:
      - cloud-v1.0.36-signing-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify cloud coexistence source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.nexa.app.cloud"' android/app/build.gradle.kts
          grep -F 'versionCode = 42' android/app/build.gradle.kts
          grep -F 'versionName = "1.0.36"' android/app/build.gradle.kts
          grep -F 'LauncherStar' android/app/src/main/AndroidManifest.xml

      - name: Build unsigned release
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Generate fixed signing key and sign with APK Signature Scheme v2+
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexa-fixed-signing /tmp/deliver
          STORE_PASS="$(openssl rand -hex 24)"
          ALIAS="nexa-cloud"
          keytool -genkeypair -v             -keystore /tmp/nexa-fixed-signing/nexa-cloud-release.jks             -storetype JKS             -storepass "$STORE_PASS"             -keypass "$STORE_PASS"             -alias "$ALIAS"             -keyalg RSA -keysize 4096 -validity 10000             -dname "CN=Nexa Cloud Release, OU=Nexa, O=Nexa, L=Singapore, ST=Singapore, C=SG"             >/dev/null 2>&1

          RELEASE="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign             --ks /tmp/nexa-fixed-signing/nexa-cloud-release.jks             --ks-pass "pass:$STORE_PASS"             --ks-key-alias "$ALIAS"             --key-pass "pass:$STORE_PASS"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out /tmp/deliver/Nexa-Cloud-1.0.36-FixedSigned.apk             "$RELEASE"

          "$APKSIGNER" verify --verbose --print-certs /tmp/deliver/Nexa-Cloud-1.0.36-FixedSigned.apk             > /tmp/deliver/APK_SIGNATURE_VERIFY.txt

          cp /tmp/nexa-fixed-signing/nexa-cloud-release.jks /tmp/deliver/nexa-cloud-release.jks
          {
            printf 'NEXA_CLOUD_KEYSTORE_PASSWORD=%s\n' "$STORE_PASS"
            printf 'NEXA_CLOUD_KEY_ALIAS=%s\n' "$ALIAS"
            printf 'NEXA_CLOUD_KEY_PASSWORD=%s\n' "$STORE_PASS"
            printf 'NEXA_CLOUD_KEYSTORE_B64='
            base64 -w0 /tmp/nexa-fixed-signing/nexa-cloud-release.jks
            printf '\n'
          } > /tmp/nexa-fixed-signing/GITHUB_SECRETS.txt

          cat > /tmp/bootstrap-public.pem <<'PUB'
-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA4igugm6vrmt3whMEGdYv
av5TzrHnA5dDgqisryP3uLN+4j0OFExsPMTV3xgHMUZlS89XneVnM993Tbr4PKJU
mhH5xQ5ew/qz+qiNLdQJ5Hs5i1PIPGm4j4jsYA6VWEtCL1vZfc6aBlk6v3NALkwK
D+PEU7lBXzkf/2pxUGkoVFXuTQf761qP5qQHarhnzGsGjhpLBaMVqUJa4yteU2KQ
FRhl0sP31CsSo1w+pboni8YVN7cwBJ6Q+ipS42iiy1MPLuJh8VjQ8h68hpkZxUxT
Qh3pORVkzNlUGpstwCgTBjSbw1h/prxc9/4sKCQbk4eN76k7ClibpNlATSiZFqtB
9Q/9mb887fofUZJg0WlO6jYcVg9fsThAl/w8z4EOIvtocmymBCL3Ut+w13lt8WHz
wOK/rS7syjsEc63cch9Sr4t3gkD9Hn8IUJsd8JhGhMJTvFhwHhOONwTeR6cRC0Vq
yKOSNWQoYSPlnGOM9IbTmPZKBSyA0ynXVXO53W/UwLRLAgMBAAE=
-----END PUBLIC KEY-----
PUB
          openssl pkeyutl -encrypt -pubin             -inkey /tmp/bootstrap-public.pem             -in /tmp/nexa-fixed-signing/GITHUB_SECRETS.txt             -out /tmp/deliver/GITHUB_SECRETS.txt.enc             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256

          sha256sum /tmp/deliver/Nexa-Cloud-1.0.36-FixedSigned.apk             /tmp/deliver/nexa-cloud-release.jks             > /tmp/deliver/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Nexa-1.0.36-Fixed-Signing-Bootstrap
          path: /tmp/deliver/*
          if-no-files-found: error
