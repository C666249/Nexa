name: Publish FMV Motion Lab public APK
on:
  push:
    branches: [fmv-motion-lab-download-v1.1]
    paths:
      - 'fmv-delivery/chunk-*.b64'
      - '.github/workflows/publish-fmv-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify exact native APK
        shell: bash
        run: |
          set -euo pipefail
          cat fmv-delivery/chunk-*.b64 | base64 --decode > FMV-Motion-Lab-v1.1-debug.apk
          echo "163aac25d6ca217a987d3ac284f39d9739dd51599f41255fbba772bee8e7d8be  FMV-Motion-Lab-v1.1-debug.apk" | sha256sum --check
          file FMV-Motion-Lab-v1.1-debug.apk
      - name: Publish direct public GitHub Release download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="fmv-motion-lab-v1.1.0-public"
          APK="FMV-Motion-Lab-v1.1-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA"               --title "FMV Motion Lab v1.1 · Android APK"               --notes "FMV Motion Lab v1.1 native Android app. Minimal light UI + FlowLedger native jelly tab. Debug-signed APK; download and install on Android. SHA-256: 163aac25d6ca217a987d3ac284f39d9739dd51599f41255fbba772bee8e7d8be."
          fi
      - name: Publish secondary direct raw APK to isolated download branch
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add FMV-Motion-Lab-v1.1-debug.apk
          git commit -m "dist(fmv): public verified v1.1 APK" || true
          git push origin HEAD:fmv-motion-lab-download-v1.1
