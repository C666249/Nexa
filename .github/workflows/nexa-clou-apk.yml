name: Nexa Clou APK

on:
  push:
    branches:
      - clou-v1.0.29-build
    paths:
      - '.github/clou/**'
      - '.github/workflows/nexa-clou-apk.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-clou:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Nexa 1.0.29 Clou overlay
        shell: bash
        run: |
          base64 -d .github/clou/nexa-1.0.29-overlay.b64 > /tmp/nexa-clou-overlay.tgz
          tar -xzf /tmp/nexa-clou-overlay.tgz -C .
          grep -n 'applicationId\|versionName\|outputFileName' android/app/build.gradle.kts
          cat android/app/src/main/res/values/strings.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Clou debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          ls -lah android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/Nexa-Clou-1.0.29-debug.apk
          sha256sum android/app/build/outputs/apk/debug/Nexa-Clou-1.0.29-debug.apk | tee Nexa-Clou-1.0.29-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Clou-1.0.29-APK
          path: |
            android/app/build/outputs/apk/debug/Nexa-Clou-1.0.29-debug.apk
            Nexa-Clou-1.0.29-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
