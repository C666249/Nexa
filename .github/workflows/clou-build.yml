name: Build Nexa Clou 1.0.32

on:
  push:
    branches:
      - clou-v1.0.32-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Reconstruct Clou 1.0.30 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat .clou/patch-*.b64 > /tmp/nexa-1030.patch.gz.b64
          echo "613cd993eab8839e2a40cd535f549b4f07401de4605e40711e56a657fe8dab9e  /tmp/nexa-1030.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/nexa-1030.patch.gz.b64 > /tmp/nexa-1030.patch.gz
          gzip -dc /tmp/nexa-1030.patch.gz > /tmp/nexa-1030.patch
          patch -p1 < /tmp/nexa-1030.patch

      - name: Apply Clou 1.0.32 delta
        shell: bash
        run: |
          set -euo pipefail
          cp .clou32/patch.b64 /tmp/nexa-1032.patch.gz.b64
          echo "66a15474a9a286dc671d34238b9c085bdb074edb9d0e00c863c7c7b1bf7cca26  /tmp/nexa-1032.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/nexa-1032.patch.gz.b64 > /tmp/nexa-1032.patch.gz
          gzip -dc /tmp/nexa-1032.patch.gz > /tmp/nexa-1032.patch
          patch -p1 < /tmp/nexa-1032.patch

      - name: Verify Clou identity and 1.0.32 Mindspace Back
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.nexa.app.clou"' android/app/build.gradle.kts
          grep -F 'versionCode = 37' android/app/build.gradle.kts
          grep -F 'versionName = "1.0.32-clou.1"' android/app/build.gradle.kts
          grep -F "function back(){if(!state.open)return 'none'" android/app/src/main/assets/nexa-mindspace.js
          grep -F 'timeline-mindspace-portal' android/app/src/main/assets/nexa-timeline.js
          grep -F "typeof NexaMindspace.back==='function'" android/app/src/main/assets/nexa-shell.js

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          find android/app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Clou-1.0.32-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
