name: Build Nexa Clou 1.0.34

on:
  push:
    branches:
      - clou-v1.0.34-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Reconstruct Clou 1.0.30 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat .clou/patch-*.b64 > /tmp/nexa-1030.patch.gz.b64
          echo "613cd993eab8839e2a40cd535f549b4f07401de4605e40711e56a657fe8dab9e  /tmp/nexa-1030.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/nexa-1030.patch.gz.b64 > /tmp/nexa-1030.patch.gz
          gzip -dc /tmp/nexa-1030.patch.gz > /tmp/nexa-1030.patch
          patch -p1 < /tmp/nexa-1030.patch

      - name: Apply Clou 1.0.31 crystal-node patch
        shell: bash
        run: |
          set -euo pipefail
          cat .clou31/part-*.b64 > /tmp/nexa-1031.patch.gz.b64
          test "$(find .clou31 -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 8
          base64 -d /tmp/nexa-1031.patch.gz.b64 > /tmp/nexa-1031.patch.gz
          gzip -dc /tmp/nexa-1031.patch.gz > /tmp/nexa-1031.patch
          patch -p1 --batch < /tmp/nexa-1031.patch || true
          find . -name '*.rej' -delete
          grep -F 'versionName = "1.0.31-clou.1"' android/app/build.gradle.kts
          grep -F 'mindspace-node-mark' android/app/src/main/assets/nexa-mindspace.js

      - name: Apply Clou 1.0.32 Mindspace patch
        shell: bash
        run: |
          set -euo pipefail
          cat .clou32/part-*.b64 > /tmp/nexa-1032.patch.gz.b64
          echo "294bc7303e238becfbeac26269ecb92740c038c0bb0ccfc6e85d6354cbc21549  /tmp/nexa-1032.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/nexa-1032.patch.gz.b64 > /tmp/nexa-1032.patch.gz
          gzip -dc /tmp/nexa-1032.patch.gz > /tmp/nexa-1032.patch
          patch -p1 --batch < /tmp/nexa-1032.patch || true
          find . -name '*.rej' -delete
          for f in nexa-mindspace.js nexa-shell.js nexa-timeline.js nexa.css; do cp "android/app/src/main/assets/$f" "ui/$f"; done

      - name: Apply Clou 1.0.33 Timeline back and circular Mindspace entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root=Path('.')
          timeline_files=[
              root/'android/app/src/main/assets/nexa-timeline.js',
              root/'ui/nexa-timeline.js',
          ]
          shell_files=[
              root/'android/app/src/main/assets/nexa-shell.js',
              root/'ui/nexa-shell.js',
          ]
          css_files=[
              root/'android/app/src/main/assets/nexa.css',
              root/'ui/nexa.css',
          ]

          old_close="function closeEditor(){const o=hasDOM()&&document.getElementById('timelineEditorOverlay');if(!o)return;o.classList.remove('active');state.editor=null;applyTimelineImeSpace(0);setTimeout(()=>{if(!o.classList.contains('active'))o.style.display='none';},220);}"
          new_close=old_close+"\n function back(){if(editorOpen()){closeEditor();return 'editor';}return 'none';}"
          old_export="return {KEY,VERSION,empty,validate,load,save,upsertEvent,removeEvent,upsertPlan,removePlan,monthSequence,statusFor,formatMarkerDate,render,install,openEventEditor,get model(){return ensureModel();}};"
          new_export="return {KEY,VERSION,empty,validate,load,save,upsertEvent,removeEvent,upsertPlan,removePlan,monthSequence,statusFor,formatMarkerDate,render,install,openEventEditor,back,get model(){return ensureModel();}};"
          for p in timeline_files:
              s=p.read_text()
              assert old_close in s, f"timeline close marker missing: {p}"
              assert old_export in s, f"timeline export marker missing: {p}"
              s=s.replace(old_close,new_close,1).replace(old_export,new_export,1)
              p.write_text(s)

          old_shell="function back(){if(window.NexaMindspace?.isOpen?.()){const layer=NexaMindspace.back?.()||'none';if(layer!=='none')return 'mindspace-'+layer;NexaMindspace.close();return 'mindspace';}const next=NexaCore.back(active);if(next===null)return 'none';navigate(next);return 'nexa-home';}"
          new_shell="function back(){const timelineLayer=window.NexaTimeline?.back?.()||'none';if(timelineLayer!=='none')return 'timeline-'+timelineLayer;if(window.NexaMindspace?.isOpen?.()){const layer=NexaMindspace.back?.()||'none';if(layer!=='none')return 'mindspace-'+layer;NexaMindspace.close();return 'mindspace';}const next=NexaCore.back(active);if(next===null)return 'none';navigate(next);return 'nexa-home';}"
          for p in shell_files:
              s=p.read_text()
              assert old_shell in s, f"shell back marker missing: {p}"
              p.write_text(s.replace(old_shell,new_shell,1))

          old_css='''.timeline-mindspace-entry{--portal-accent:#9b7db8;position:relative;isolation:isolate;overflow:hidden;flex:none;border:1px solid #dfd3e7;background:linear-gradient(145deg,#fbf8fc 0%,#f1eaf5 52%,#e9dff0 100%);color:#5f5268;border-radius:20px;min-height:54px;padding:0 14px 0 10px;display:flex;align-items:center;gap:9px;box-shadow:0 7px 18px #5d496913,inset 0 1px 0 #ffffffc9;transition:transform 220ms var(--nexa-ease-emphasized),box-shadow 260ms ease,border-color 260ms ease}
          .timeline-mindspace-entry::before{content:"";position:absolute;inset:-55% -20%;z-index:-1;background:radial-gradient(circle at 70% 42%,#b797d321,transparent 34%),radial-gradient(circle at 24% 70%,#ffffffa8,transparent 24%);opacity:.78;transform:translate3d(-8%,0,0);transition:transform 560ms var(--nexa-ease-emphasized),opacity 260ms ease}
          .timeline-mindspace-entry>span:last-child{display:grid;gap:1px;text-align:left;line-height:1}.timeline-mindspace-entry>span:last-child b{font-size:11px;font-weight:680;letter-spacing:.01em}.timeline-mindspace-entry>span:last-child small{font-size:7px;font-weight:500;color:#8d7e96;letter-spacing:.03em;white-space:nowrap}
          .timeline-mindspace-portal{position:relative;width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 44% 38%,#ffffffee 0 9%,#efe5f5 24%,#d8c4e5 48%,#8f72a73d 69%,transparent 72%);box-shadow:0 0 0 1px #ffffffb8,0 5px 12px #6b547622,inset 0 0 12px #ffffffb8}
          '''
          new_css='''.timeline-mindspace-entry{--portal-accent:#9b7db8;position:relative;flex:none;width:54px;height:54px;min-height:54px;padding:0;border:0;background:transparent;color:#5f5268;border-radius:50%;display:grid;place-items:center;box-shadow:none;overflow:visible;transition:transform 220ms var(--nexa-ease-emphasized),filter 260ms ease}
          .timeline-mindspace-entry::before{content:none}
          .timeline-mindspace-entry>span:last-child{display:none}
          .timeline-mindspace-portal{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 44% 38%,#ffffffee 0 9%,#f1e8f6 24%,#ddcce9 52%,#a888be5c 76%,#8a6fa036 100%);border:1px solid #d9c7e4;box-shadow:0 5px 13px #6b54761a,inset 0 0 14px #ffffffc4}
          '''
          old_active='.timeline-mindspace-entry:active{transform:scale(.955)}.timeline-mindspace-entry:active::before{transform:translate3d(5%,0,0);opacity:1}.timeline-mindspace-entry:focus-visible{outline:2px solid #a88bc0;outline-offset:3px}'
          new_active='.timeline-mindspace-entry:active{transform:scale(.92)}.timeline-mindspace-entry:active .timeline-mindspace-portal{filter:brightness(1.04)}.timeline-mindspace-entry:focus-visible{outline:2px solid #a88bc0;outline-offset:3px}'
          old_mobile='.timeline-mindspace-entry>span:last-child{display:none}.timeline-mindspace-entry{width:50px;min-height:50px;padding:0;justify-content:center}.timeline-mindspace-portal{width:34px;height:34px}'
          new_mobile='.timeline-mindspace-entry{width:50px;height:50px;min-height:50px;padding:0}.timeline-mindspace-portal{width:42px;height:42px}'
          for p in css_files:
              s=p.read_text()
              assert old_css in s, f"portal CSS marker missing: {p}"
              assert old_active in s, f"portal active marker missing: {p}"
              assert old_mobile in s, f"portal mobile marker missing: {p}"
              s=s.replace(old_css,new_css,1).replace(old_active,new_active,1).replace(old_mobile,new_mobile,1)
              p.write_text(s)

          p=root/'android/app/build.gradle.kts'
          s=p.read_text()
          s=s.replace('versionCode = 37','versionCode = 38',1)
          s=s.replace('versionName = "1.0.32-clou.1"','versionName = "1.0.33-clou.1"',1)
          s=s.replace('Nexa-Clou-1.0.32-clou.1-${variantBuildType}.apk','Nexa-Clou-1.0.33-clou.1-${variantBuildType}.apk',1)
          p.write_text(s)
          PY

      - name: Refresh 1.0.33 release metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > CHANNEL.txt <<'TXT'
          Nexa Clou / cloud-build test channel
          applicationId: com.nexa.app.clou
          app name: Nexa Clou
          versionName: 1.0.33-clou.1
          versionCode: 38
          Scope: Timeline editor local Back hierarchy + circular-only Mindspace entry.
          TXT
          cat > RELEASE_NOTES_1.0.33.md <<'TXT'
          # Nexa 1.0.33 — Timeline Back + Circular Mindspace Entry

          - Android/system Back while the Timeline create/edit event sheet is open closes only the sheet and stays on Timeline.
          - The same local Back handler covers event editors and concrete-plan editors.
          - Timeline's Mindspace entry removes the outer rounded-square glass button and keeps only the circular star-orbit portal.
          - Mindspace hierarchy, Timeline data schema and persistence are unchanged.
          TXT
          cat > PROJECT_STATE.md <<'TXT'
          # Nexa Project State

          Current release: 1.0.33 / versionCode 38.

          Channels:
          - Stable: com.nexa.app / Nexa / 1.0.33
          - Beta: com.nexa.app.beta / Nexa β / 1.0.33-beta.1
          - Clou: com.nexa.app.clou / Nexa Clou / 1.0.33-clou.1

          1.0.33 is a focused navigation/UI release. Timeline editor sheets consume Back locally before the Timeline route can return home. The Timeline Mindspace entry is now circular-only.
          TXT
          cat > NEXA_1.0.33_DELIVERY.txt <<'TXT'
          Nexa 1.0.33 / code 38
          Scope: Timeline create/edit sheet local Back + circular-only Mindspace entry.
          Data/schema: unchanged.
          TXT

      - name: Verify 1.0.33 runtime and regression
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.nexa.app.clou"' android/app/build.gradle.kts
          grep -F 'versionCode = 38' android/app/build.gradle.kts
          grep -F 'versionName = "1.0.33-clou.1"' android/app/build.gradle.kts
          grep -F "function back(){if(editorOpen()){closeEditor();return 'editor';}return 'none';}" android/app/src/main/assets/nexa-timeline.js
          grep -F "const timelineLayer=window.NexaTimeline?.back?.()||'none'" android/app/src/main/assets/nexa-shell.js
          grep -F '.timeline-mindspace-entry::before{content:none}' android/app/src/main/assets/nexa.css
          grep -F '.timeline-mindspace-entry>span:last-child{display:none}' android/app/src/main/assets/nexa.css
          grep -F 'border-radius:50%;background:radial-gradient' android/app/src/main/assets/nexa.css
          cmp ui/nexa-shell.js android/app/src/main/assets/nexa-shell.js
          cmp ui/nexa-timeline.js android/app/src/main/assets/nexa-timeline.js
          cmp ui/nexa.css android/app/src/main/assets/nexa.css
          for f in ui/*.js; do node --check "$f"; done
          echo "1.0.33 focused regression OK"

      - name: Apply Nexa 1.0.34 shared-portal transition
        shell: bash
        run: |
          set -euo pipefail
          cp .clou34/focus.b64 /tmp/nexa-1034.patch.gz.b64
          echo "3b376e94e1d8e49d130fd0fdca014c141b13b887ac737875e104dc32639c03b6  /tmp/nexa-1034.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/nexa-1034.patch.gz.b64 > /tmp/nexa-1034.patch.gz
          gzip -dc /tmp/nexa-1034.patch.gz > /tmp/nexa-1034.patch
          patch -p1 --batch < /tmp/nexa-1034.patch

      - name: Verify 1.0.34 portal continuity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.nexa.app.clou"' android/app/build.gradle.kts
          grep -F 'versionCode = 39' android/app/build.gradle.kts
          grep -F 'versionName = "1.0.34-clou.1"' android/app/build.gradle.kts
          grep -F 'openFrom(portal)' android/app/src/main/assets/nexa-timeline.js
          grep -F 'function openFrom(source){open(source);}' android/app/src/main/assets/nexa-mindspace.js
          grep -F 'getBoundingClientRect' android/app/src/main/assets/nexa-mindspace.js
          grep -F "clipPath:'circle(" android/app/src/main/assets/nexa-mindspace.js
          grep -F 'liveClip=root.getComputedStyle?.(el)?.clipPath' android/app/src/main/assets/nexa-mindspace.js
          grep -F '.mindspace-portal-echo' android/app/src/main/assets/nexa.css
          grep -F 'body.nexa-mindspace-under #nexaTimeline' android/app/src/main/assets/nexa.css
          cmp ui/nexa-mindspace.js android/app/src/main/assets/nexa-mindspace.js
          cmp ui/nexa-timeline.js android/app/src/main/assets/nexa-timeline.js
          cmp ui/nexa.css android/app/src/main/assets/nexa.css
          for f in ui/*.js; do node --check "$f"; done
          node --test tests/nexa-mindspace-v1.0.34.test.cjs

      - name: Build Clou 1.0.34 debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p /tmp/deliver
          cp android/app/build/outputs/apk/debug/*.apk /tmp/deliver/Nexa-Clou-1.0.34-Debug.apk
          sha256sum /tmp/deliver/Nexa-Clou-1.0.34-Debug.apk

      - name: Upload Nexa 1.0.34 APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Clou-1.0.34-Debug
          path: /tmp/deliver/Nexa-Clou-1.0.34-Debug.apk
          if-no-files-found: error
