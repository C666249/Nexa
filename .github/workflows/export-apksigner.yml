name: Export Android apksigner

on:
  push:
    branches: [tool-apksigner-export]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package apksigner tool
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          DIR="$(dirname "$TOOL")"
          mkdir -p /tmp/apksigner-tool
          cp "$TOOL" /tmp/apksigner-tool/apksigner
          cp "$DIR/lib/apksigner.jar" /tmp/apksigner-tool/apksigner.jar
          chmod +x /tmp/apksigner-tool/apksigner
          "$TOOL" version > /tmp/apksigner-tool/VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: /tmp/apksigner-tool/*
          if-no-files-found: error
